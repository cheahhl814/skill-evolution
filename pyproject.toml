[project]
name = "pi-skill-evolution"
version = "0.1.0"
description = "Layer-2 offline evolution for Pi agent skills: DSPy+GEPA optimization of SKILL.md files under ~/.agents/skills, constraint-gated, git-branch deployment for human review"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["click", "rich", "pyyaml"]

[project.optional-dependencies]
evolution = ["dspy>=2.6", "gepa"]          # runtime optimization (API calls only, no GPU training)
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evolution"]